name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source bundle
        run: zip -r ai-car-doctor-source.zip core services ui tests requirements.txt README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ai-car-doctor-source
          path: ai-car-doctor-source.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release bundle
        run: zip -r ai-car-doctor-${GITHUB_REF_NAME}.zip core services ui tests requirements.txt README.md
      - uses: softprops/action-gh-release@v2
        with:
          files: ai-car-doctor-${GITHUB_REF_NAME}.zip
          generate_release_notes: true
