name: CI

on:
  push:
    branches: [master, development, 'feature/**', 'fix/**']
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run coverage gate
        run: PYTHONPATH=. python -m pytest --cov=core --cov=services --cov-report=term-missing --cov-fail-under=80

  build:
    name: build
    needs: [test, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source bundle
        run: zip -r ai-car-doctor-source.zip core services ui tests docs requirements.txt README.md AGENTS.md CONTRIBUTING.md
      - uses: actions/upload-artifact@v4
        with:
          name: ai-car-doctor-source
          path: ai-car-doctor-source.zip
